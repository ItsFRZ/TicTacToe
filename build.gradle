// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext{
        kotlin_version = '1.9.22'
        nav_version = '2.7.6'
        agp_version = '8.9.1'
        app_compat_version = '1.7.1'
        core_ktx_version = '1.9.0'
        constraint_layout_version = '2.1.4'
        lifecycle_version = '2.4.0'
        datastore_version = '1.0.0'
        kotlinx_collections_version = '0.3.5'
        serialization_json_version = '1.0.1'
        retrofit_json_converter_version = '2.9.0'
        junit_test_version = '4.13.2'
        junit_implementation_version = '1.1.5'
        expresso_core_version = '3.5.1'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.5.31"
        classpath "org.jetbrains.kotlin:kotlin-android-extensions:1.5.31"
        classpath "org.jetbrains.kotlin:kotlin-serialization:1.6.10"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
    }
}
plugins {
    id 'com.android.application' version '8.3.2' apply false
    id 'com.android.library' version '8.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}
println(com.android.tools.r8.Version.getVersionString())

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs'
}

android {
    namespace 'com.itsfrz.tictactoe'
    compileSdk 35
    buildToolsVersion "35.0.0"

    aaptOptions {
        cruncherEnabled = false
    }

    packaging {
        resources {
            excludes += ['META-INF/com/android/build/gradle/app-metadata.properties']
        }
    }

    defaultConfig {
        applicationId "com.itsfrz.tictactoe"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.0.4"
        vectorDrawables.generatedDensities = []

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            vcsInfo.include false
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
        freeCompilerArgs += [
                '-P',
                'plugin:androidx.compose.compiler.plugins.kotlin:sourceInformation=false'
        ]
    }

    buildFeatures{
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"

    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.contains("ArtProfile")) {
        task.enabled = false
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += [
                "-P",
                "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
        ]
    }
}

dependencies {

    // Modules
    implementation(project(":minimax"))
    implementation(project(":goonline"))
    implementation 'androidx.compose.material3:material3:1.4.0'

    def composeBom = platform("androidx.compose:compose-bom:2024.01.00")
    implementation(composeBom)
    androidTestImplementation(composeBom)

    // Compose
    implementation "androidx.appcompat:appcompat:$app_compat_version"
    implementation "androidx.core:core-ktx:$core_ktx_version"
    implementation "androidx.compose.runtime:runtime"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.foundation:foundation-layout"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.animation:animation-core:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:$constraint_layout_version"
    implementation("androidx.compose.material:material-icons-extended")
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    // datastore
    implementation "androidx.datastore:datastore-preferences:$datastore_version"
//    implementation "org.jetbrains.kotlinx:kotlinx-collections-immutable:$kotlinx_collections_version"
//    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$serialization_json_version"

    testImplementation "junit:junit:$junit_test_version"
    androidTestImplementation "androidx.test.ext:junit:$junit_implementation_version"
    androidTestImplementation "androidx.test.espresso:espresso-core:$expresso_core_version"

    implementation("io.coil-kt:coil-compose:2.5.0")
    implementation("androidx.browser:browser:1.8.0")
    implementation("com.airbnb.android:lottie-compose:6.3.0")

}